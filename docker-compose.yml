# ─────────────────────────────────────────────────────────────
# Taqendurt — déploiement : app Next.js (standalone) + SQLite
# Compatible Coolify / Traefik. PostgreSQL possible en option
# (voir README.md § « Bascule PostgreSQL »).
# Démarrage : docker compose up -d --build
# ─────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Port 6544 externe pour éviter les conflits avec d'autres projets Coolify
    # Port 3000 interne pour Next.js
    ports:
      - "6544:3000"
    labels:
      - "coolify.managed=true"
      - "coolify.port=6544"
      - "traefik.enable=true"
      - "traefik.http.routers.taqendurt.rule=Host(`myrobe-glize.com`) || Host(`www.myrobe-glize.com`)"
      - "traefik.http.routers.taqendurt.entrypoints=websecure"
      - "traefik.http.routers.taqendurt.tls=true"
      - "traefik.http.routers.taqendurt.tls.certresolver=letsencrypt"
      - "traefik.http.services.taqendurt.loadbalancer.server.port=6544"
    # Toutes les variables sont passées « au travers » pour que
    # l'onglet Environnement de Coolify (ou un .env local) les
    # transmette au conteneur sans modifier ce fichier.
    environment:
      # SQLite sur volume persistant — AUCUNE configuration requise
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/taqendurt.db}
      # Seed démo si base vierge (false pour démarrer vide)
      SEED_DEMO: ${SEED_DEMO:-true}
      # URL publique avec SSL (SEO, sitemap, Open Graph)
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://myrobe-glize.com}
      # Email de notification des commandes (sinon : Paramètres admin)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # SMTP optionnel — sans SMTP, les emails sont journalisés
      # en base (table MailLog, visibles dans l'admin)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      # Images uploadées depuis le back-office → persistentes
      - uploads:/app/public/uploads
      # Base SQLite → persiste entre les reconstructions
      - appdata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/meta >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

